name: Python wheels
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14", "3.15.0-rc.3"]
    env:
      PIP_ONLY_BINARY: ":all:"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ contains(matrix.python-version, 'rc') }}
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Test the installed wheel
        run: |
          python -m pip install pytest
          python -m pip install --no-index --no-deps dist/*.whl
          cp -R test "$RUNNER_TEMP/test"
          cd "$RUNNER_TEMP"
          python -m pytest test -v
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error
